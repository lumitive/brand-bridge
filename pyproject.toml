[project]
name = "brand-bridge"
version = "0.1.0"
description = "Turn any brand's POS/CRM/master-data into AI-ready capabilities exposed via MCP."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Lumitive", email = "engineering@lumitive.example" },
]
keywords = ["mcp", "ai", "agent", "pos", "crm", "brand", "integration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "httpx>=0.27",
    "mcp>=1.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
brand-bridge = "brand_bridge.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/lumitive/brand-bridge"
Issues = "https://github.com/lumitive/brand-bridge/issues"
Documentation = "https://lumitive.github.io/brand-bridge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brand_bridge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# Exception names follow stdlib convention (KeyError but StopIteration,
# GeneratorExit) — RateLimitExceeded reads more naturally than
# RateLimitExceededError. Names are quoted in SECURITY.md / CHANGELOG.md.
"src/brand_bridge/core/errors.py" = ["N818"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
