# Coffee chain preset — Manner / Peet's / Starbucks-style menus.
# Used by `brand-bridge tenant init <id> --preset coffee` to produce a
# starting tenant.yaml that brands customize from.

size_options:
  tall:   { name: "Tall",   extra_price: 0 }
  grande: { name: "Grande", extra_price: 3 }
  venti:  { name: "Venti",  extra_price: 6 }

milk_options:
  whole:   { name: "Whole milk",   extra_price: 0 }
  skim:    { name: "Skim milk",    extra_price: 0 }
  oat:     { name: "Oat milk",     extra_price: 4 }
  almond:  { name: "Almond milk",  extra_price: 4 }
  soy:     { name: "Soy milk",     extra_price: 4 }
  coconut: { name: "Coconut milk", extra_price: 4 }

temp_options:
  hot:     { name: "Hot" }
  iced:    { name: "Iced" }
  blended: { name: "Blended" }

extra_options:
  extra_shot:      { name: "Extra shot",     price: 4 }
  vanilla_syrup:   { name: "Vanilla syrup",  price: 3 }
  caramel_syrup:   { name: "Caramel syrup",  price: 3 }
  hazelnut_syrup:  { name: "Hazelnut syrup", price: 3 }
  whipped_cream:   { name: "Whipped cream",  price: 2 }
  chocolate_sauce: { name: "Chocolate sauce", price: 2 }

valid_pickup: ["pickup", "delivery", "dine_in"]

rate_limits:
  L0: { max_calls: 60, window_seconds: 60 }
  L1: { max_calls: 30, window_seconds: 60 }
  L2: { max_calls: 5,  window_seconds: 3600 }
  L3: { max_calls: 10, window_seconds: 86400 }

features:
  campaigns: true
  coupons: true
  stars_mall: true
  delivery: true
  nutrition: true
  ops_copilot: false
