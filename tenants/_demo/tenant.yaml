tenant_id: _demo
tenant_name: brand-bridge demo
locale: zh-CN
currency: HKD
default_user_id: DEMO_USER

instructions: |
  Default demo tenant shipped with brand-bridge. All five providers fall back
  to the in-memory DemoAdapter, so this tenant works without any external
  configuration. Use it for local exploration, integration tests, and as the
  sanity check for new MCP tools.

features:
  campaigns: true
  coupons: true
  stars_mall: true
  delivery: true
  nutrition: true
  ops_copilot: true
  agentic_payment: false

rate_limits:
  L0: { max_calls: 60, window_seconds: 60 }
  L1: { max_calls: 30, window_seconds: 60 }
  L2: { max_calls: 5,  window_seconds: 3600 }
  L3: { max_calls: 10, window_seconds: 86400 }

validation:
  phone_pattern: "^1\\d{10}$"
  max_quantity: 50
  max_items_per_order: 10
  max_addresses: 5

# providers: omitted intentionally — falls through to DemoAdapter for all five.
